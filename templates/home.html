<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Brain Stroke Prediction</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary">
			<div class="container">
				<a class="navbar-brand brand" href="#">Brain Stroke Predictor</a>
			</div>
		</nav>

		<div class="container py-4">
			<div class="row g-4">
				<div class="col-lg-8">
					<div class="card">
						<div class="card-body">
							  <h5 class="card-title mb-3">Enter Patient Details</h5>
							  <p class="text-muted mb-4">Provide the following information to predict the likelihood of a brain stroke.</p>

							<form method="POST" action="/predictdata">
								<div class="row g-3">
									<div class="col-md-6">
										<label for="gender" class="form-label">Gender</label>
										<select class="form-select" id="gender" name="gender" required>
											<option value="">Select...</option>
											<option value="Male">Male</option>
											<option value="Female">Female</option>
											<option value="Other">Other</option>
										</select>
									</div>

									<div class="col-md-6">
										<label for="age" class="form-label">Age</label>
										<input type="number" step="0.1" min="0" max="120" class="form-control" id="age" name="age" placeholder="e.g., 45" required>
									</div>

									<div class="col-md-6">
										<label for="hypertension" class="form-label">Hypertension</label>
										<select class="form-select" id="hypertension" name="hypertension" required>
											<option value="">Select...</option>
											<option value="0">No</option>
											<option value="1">Yes</option>
										</select>
									</div>

									<div class="col-md-6">
										<label for="heart_disease" class="form-label">Heart Disease</label>
										<select class="form-select" id="heart_disease" name="heart_disease" required>
											<option value="">Select...</option>
											<option value="0">No</option>
											<option value="1">Yes</option>
										</select>
									</div>

									<div class="col-md-6">
										<label for="ever_married" class="form-label">Ever Married</label>
										<select class="form-select" id="ever_married" name="ever_married" required>
											<option value="">Select...</option>
											<option value="Yes">Yes</option>
											<option value="No">No</option>
										</select>
									</div>

									<div class="col-md-6">
										<label for="work_type" class="form-label">Work Type</label>
										<select class="form-select" id="work_type" name="work_type" required>
											<option value="">Select...</option>
											<option value="Private">Private</option>
											<option value="Self-employed">Self-employed</option>
											<option value="Govt_job">Govt_job</option>
											<option value="children">children</option>
											<option value="Never_worked">Never_worked</option>
										</select>
									</div>

									<div class="col-md-6">
										<label for="Residence_type" class="form-label">Residence Type</label>
										<select class="form-select" id="Residence_type" name="Residence_type" required>
											<option value="">Select...</option>
											<option value="Urban">Urban</option>
											<option value="Rural">Rural</option>
										</select>
									</div>

									<div class="col-md-6">
										<label for="avg_glucose_level" class="form-label">Avg Glucose Level</label>
										<input type="number" step="0.01" min="0" class="form-control" id="avg_glucose_level" name="avg_glucose_level" placeholder="e.g., 75.5" required>
									</div>

									<div class="col-md-6">
										<label for="bmi" class="form-label">BMI</label>
										<input type="number" step="0.1" min="0" class="form-control" id="bmi" name="bmi" placeholder="e.g., 23.4" required>
									</div>

									<div class="col-md-6">
										<label for="smoking_status" class="form-label">Smoking Status</label>
										<select class="form-select" id="smoking_status" name="smoking_status" required>
											<option value="">Select...</option>
											<option value="never smoked">Never smoked</option>
											<option value="formerly smoked">Formerly smoked</option>
											<option value="smokes">Smokes</option>
											<option value="Unknown">Unknown</option>
										</select>
									</div>
								</div>

								<div class="d-flex justify-content-end mt-4">
									<button class="btn btn-primary btn-lg btn-shine" type="submit">Predict</button>
								</div>
							</form>
						</div>
					</div>
				</div>

				<div class="col-lg-4">
					<div class="info-card h-100 d-flex flex-column justify-content-center align-items-center text-center">
						<div>
							<h5 class="mb-2">Fast, Reliable Prediction</h5>
							<p class="text-muted">Your data is processed securely using our trained ML model.</p>
						</div>
					</div>
					<div class="mt-3 text-center footer">
						<small>&copy; {{ 2025 }} Brain Stroke Predictor</small>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
